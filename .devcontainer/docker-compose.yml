services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3.1:8b
      - COSMOS_ENDPOINT=http://cosmosdb:8081
      - COSMOS_HEALTHCHECK_URL=http://cosmosdb:8080/ready
      - COSMOS_KEY=C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==
      - COSMOS_DATABASE=leadgen-local
      - COSMOS_PROFILES_CONTAINER=profiles
      - COSMOS_JOURNEYS_CONTAINER=journeys
      - COSMOS_EVENTS_CONTAINER=events
      - COSMOS_DECISION_TRACES_CONTAINER=decision-traces
    depends_on:
      ollama:
        condition: service_healthy
      cosmosdb:
        condition: service_healthy

  ollama:
    image: ollama/ollama
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  cosmosdb:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-latest
    ports:
      - "8080:8080"
      - "8081:8081"
      - "1234:1234"
    environment:
      - PROTOCOL=http
      - ENABLE_EXPLORER=true
      - GATEWAY_PUBLIC_ENDPOINT=cosmosdb
    volumes:
      - cosmosdb_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "bash",
          "-lc",
          "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep '200 OK' <&3 >/dev/null",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  ollama_data:
  cosmosdb_data:
