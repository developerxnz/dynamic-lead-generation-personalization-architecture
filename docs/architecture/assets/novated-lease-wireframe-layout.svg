<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="980" viewBox="0 0 1400 980" role="img" aria-labelledby="title desc">
  <title id="title">Novated lease wireframe layout</title>
  <desc id="desc">Wireframe showing the main sections of a novated-leasing content and CTA layout, including the one-third metadata and decisioning panel.</desc>
  <rect width="1400" height="980" fill="#f5f7fb"/>
  <rect x="24" y="24" width="1352" height="932" rx="20" fill="#ffffff" stroke="#d9e1ee"/>
  <text x="48" y="62" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#1f2a44">Novated Leasing Wireframe Layout</text>
  <text x="48" y="92" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6780">Section-labeled wireframe showing how the page can be structured without relying on final visual design</text>

  <rect x="48" y="120" width="858" height="796" rx="18" fill="#fcfdff" stroke="#d9e1ee"/>
  <rect x="930" y="120" width="422" height="796" rx="18" fill="#fcfdff" stroke="#d9e1ee"/>
  <line x1="906" y1="120" x2="906" y2="916" stroke="#e1e7f0" stroke-width="2"/>

  <rect x="72" y="148" width="810" height="126" rx="14" fill="none" stroke="#7e8aa3" stroke-dasharray="10 8"/>
  <text x="92" y="184" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1f2a44">1. Hero and journey framing</text>
  <text x="92" y="214" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#4c5a78">Headline, savings message, and short explanation of the current next best action.</text>

  <rect x="72" y="298" width="382" height="250" rx="14" fill="none" stroke="#7e8aa3" stroke-dasharray="10 8"/>
  <text x="92" y="334" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1f2a44">2. Vehicle content card A</text>
  <text x="92" y="364" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#4c5a78">Example EV content card with image area, offer summary, and fit tags.</text>
  <rect x="108" y="388" width="310" height="106" rx="12" fill="none" stroke="#b0bacd" stroke-dasharray="8 8"/>
  <text x="126" y="446" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#4c5a78">image slot</text>

  <rect x="500" y="298" width="382" height="250" rx="14" fill="none" stroke="#7e8aa3" stroke-dasharray="10 8"/>
  <text x="520" y="334" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1f2a44">3. Vehicle content card B</text>
  <text x="520" y="364" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#4c5a78">Alternate vehicle option or comparison card with savings explanation.</text>
  <rect x="536" y="388" width="310" height="106" rx="12" fill="none" stroke="#b0bacd" stroke-dasharray="8 8"/>
  <text x="554" y="446" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#4c5a78">image slot</text>

  <rect x="72" y="572" width="810" height="132" rx="14" fill="none" stroke="#7e8aa3" stroke-dasharray="10 8"/>
  <text x="92" y="608" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1f2a44">4. CTA and handoff section</text>
  <text x="92" y="638" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#4c5a78">Primary CTA, secondary CTA, deep-link note, and disclosure text. No embedded form inside the content surface.</text>

  <rect x="72" y="728" width="810" height="158" rx="14" fill="none" stroke="#7e8aa3" stroke-dasharray="10 8"/>
  <text x="92" y="764" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1f2a44">5. Funnel progression and supporting explanation</text>
  <text x="92" y="794" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#4c5a78">Shows how the customer moves from compare, to savings review, to quote handoff.</text>
  <text x="92" y="820" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#4c5a78">Useful as a presentation view for product, content, and engineering alignment.</text>

  <rect x="954" y="148" width="374" height="120" rx="14" fill="none" stroke="#7e8aa3" stroke-dasharray="10 8"/>
  <text x="972" y="184" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1f2a44">A. Profile and active journey</text>
  <text x="972" y="214" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#4c5a78">Customer state, active journey, intent, funnel stage, and resume signals.</text>

  <rect x="954" y="292" width="374" height="160" rx="14" fill="none" stroke="#7e8aa3" stroke-dasharray="10 8"/>
  <text x="972" y="328" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1f2a44">B. Contentful metadata</text>
  <text x="972" y="358" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#4c5a78">service_category, vehicle_type, funnel_stage, cta_type, cta_deep_link,</text>
  <text x="972" y="382" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#4c5a78">conversion_goal, compliance_flags, and provider or campaign fields.</text>

  <rect x="954" y="476" width="374" height="152" rx="14" fill="none" stroke="#7e8aa3" stroke-dasharray="10 8"/>
  <text x="972" y="512" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1f2a44">C. AI support signals</text>
  <text x="972" y="542" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#4c5a78">Semantic retrieval hints, explanation support, likely next-question signals,</text>
  <text x="972" y="566" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#4c5a78">and candidate expansion support.</text>

  <rect x="954" y="652" width="374" height="234" rx="14" fill="none" stroke="#7e8aa3" stroke-dasharray="10 8"/>
  <text x="972" y="688" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#1f2a44">D. Deterministic rules and outcome</text>
  <text x="972" y="718" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#4c5a78">Eligibility gating, suitability checks, disclosure requirements, diversity rules,</text>
  <text x="972" y="742" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#4c5a78">deep-link validation, and the final ranked next best action.</text>
  <text x="972" y="780" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#4c5a78">This panel is the 1/3 explanatory layer that shows why the visible content</text>
  <text x="972" y="804" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#4c5a78">was chosen for the current session.</text>
</svg>
