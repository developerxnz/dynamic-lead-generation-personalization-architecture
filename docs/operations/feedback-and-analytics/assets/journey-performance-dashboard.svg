<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Journey Performance Dashboard Mockup</title>
  <desc id="desc">Illustrative dashboard mockup showing journey selection, progression funnels, resume success, abandonment, and secondary journey surfacing.</desc>
