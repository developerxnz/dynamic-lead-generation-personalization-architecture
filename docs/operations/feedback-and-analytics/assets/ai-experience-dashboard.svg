<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">AI Experience Dashboard Mockup</title>
  <desc id="desc">Illustrative dashboard mockup showing AI explanation engagement, conversion delta, journey-selection quality, conversational progression, response acceptance, and fallback rates.</desc>
  <rect width="1200" height="760" fill="#f5f7fb"/>
  <rect x="24" y="24" width="1152" height="712" rx="20" fill="#ffffff" stroke="#d9e1ee"/>
  <text x="48" y="64" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#1f2a44">AI Experience Dashboard</text>
  <text x="48" y="92" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#5b6780">Illustrative view of AI response quality, runtime behavior, and qualified progression</text>

  <rect x="48" y="120" width="180" height="96" rx="14" fill="#eef4ff" stroke="#cfdcf7"/>
  <text x="64" y="150" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#4c5a78">Acceptance rate</text>
  <text x="64" y="188" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1f2a44">91.6%</text>

  <rect x="244" y="120" width="180" height="96" rx="14" fill="#eefaf3" stroke="#d0ecd9"/>
  <text x="260" y="150" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#4c5a78">AI conversion delta</text>
  <text x="260" y="188" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1f2a44">+8.3%</text>

  <rect x="440" y="120" width="180" height="96" rx="14" fill="#f4f0ff" stroke="#ddd4f7"/>
  <text x="456" y="150" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#4c5a78">Grounding defects</text>
  <text x="456" y="188" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1f2a44">1.9%</text>

  <rect x="636" y="120" width="180" height="96" rx="14" fill="#fff7ec" stroke="#f1ddba"/>
  <text x="652" y="150" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#4c5a78">Fallback rate</text>
  <text x="652" y="188" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700" fill="#1f2a44">6.8%</text>

  <rect x="832" y="120" width="320" height="96" rx="14" fill="#edf8ff" stroke="#d2e8f6"/>
  <text x="848" y="150" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#4c5a78">Best prompt + model pair</text>
  <text x="848" y="188" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#1f2a44">offer-explainer-v2 + gpt-5.4</text>

  <rect x="48" y="244" width="540" height="220" rx="16" fill="#ffffff" stroke="#d9e1ee"/>
  <text x="68" y="274" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1f2a44">AI-assisted vs non-AI conversion delta</text>
  <line x1="108" y1="424" x2="548" y2="424" stroke="#c7d2e6"/>
  <rect x="154" y="330" width="86" height="94" rx="8" fill="#3f7cff"/>
  <rect x="310" y="288" width="86" height="136" rx="8" fill="#54c982"/>
  <text x="162" y="448" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6780">Control</text>
  <text x="322" y="448" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6780">AI assisted</text>

  <rect x="604" y="244" width="548" height="220" rx="16" fill="#ffffff" stroke="#d9e1ee"/>
  <text x="624" y="274" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1f2a44">Journey-selection agreement and escalation</text>
  <polyline points="644,402 712,392 780,378 848,360 916,354 984,338 1052,324 1120,310" fill="none" stroke="#845ef7" stroke-width="4"/>
  <polyline points="644,430 712,426 780,422 848,416 916,410 984,406 1052,400 1120,396" fill="none" stroke="#ff8c42" stroke-width="4"/>
  <text x="624" y="304" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#845ef7">Agreement rate</text>
  <text x="728" y="304" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#ff8c42">Escalation rate</text>

  <rect x="48" y="484" width="560" height="220" rx="16" fill="#ffffff" stroke="#d9e1ee"/>
  <text x="68" y="514" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1f2a44">Conversational assist progression</text>
  <path d="M96 640 H226 L206 600 H116 Z" fill="#dce7ff"/>
  <path d="M252 640 H382 L364 600 H270 Z" fill="#bed4ff"/>
  <path d="M408 640 H538 L522 600 H424 Z" fill="#8ab4ff"/>
  <text x="134" y="624" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#1f2a44">Open</text>
  <text x="287" y="624" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#1f2a44">Guide</text>
  <text x="447" y="624" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#ffffff">Quote</text>
  <text x="92" y="562" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6780">3,400 sessions</text>
  <text x="248" y="562" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6780">2,160 progressed</text>
  <text x="404" y="562" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#5b6780">1,140 quote starts</text>

  <rect x="624" y="484" width="528" height="220" rx="16" fill="#ffffff" stroke="#d9e1ee"/>
  <text x="644" y="514" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700" fill="#1f2a44">Fallback and timeout rate by task type</text>
  <rect x="664" y="560" width="156" height="22" rx="10" fill="#dce7ff"/>
  <rect x="664" y="602" width="110" height="22" rx="10" fill="#bed4ff"/>
  <rect x="664" y="644" width="84" height="22" rx="10" fill="#a8c4ff"/>
  <text x="664" y="550" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#4c5a78">Offer explanation</text>
  <text x="664" y="592" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#4c5a78">Journey interpretation</text>
  <text x="664" y="634" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#4c5a78">Conversation summary</text>
  <text x="830" y="576" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2a44">7.1%</text>
  <text x="784" y="618" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2a44">4.8%</text>
  <text x="758" y="660" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#1f2a44">3.2%</text>
</svg>
